server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: student-card-service   # registered in Eureka as STUDENT-CARD-SERVICE
  datasource:
    url: "jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_card_db}?createDatabaseIfNotExist=true"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.MariaDBLegacyDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always