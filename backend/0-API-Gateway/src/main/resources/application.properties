spring.application.name=gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.cloud.gateway.server.webflux.routes[0].id=GAMIFICATION
#spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[0].uri=lb://gamification-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/gamification/**


# Route pour la documentation OpenAPI de gamification
spring.cloud.gateway.server.webflux.routes[1].id=GAMIFICATION-DOCS
spring.cloud.gateway.server.webflux.routes[1].uri=lb://gamification-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/gamification/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/gamification/v3/api-docs, /v3/api-docs

# Portail Swagger unifié
springdoc.swagger-ui.urls[0].name=Gamification
springdoc.swagger-ui.urls[0].url=/gamification/v3/api-docs

spring.cloud.gateway.server.webflux.routes[1].filters[1]=PreserveHostHeader

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.filter.ReactiveLoadBalancerClientFilter=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG