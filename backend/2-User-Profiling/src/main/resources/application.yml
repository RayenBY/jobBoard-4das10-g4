# Local defaults. Every value can be overridden by an environment variable,
# and by the Config Server (config-repo) when it is running.
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service            # registered in Eureka as USER-SERVICE (lb://USER-SERVICE)
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Eureka client: registers as USER-SERVICE and sends a heartbeat every 30 s.
# Default: Eureka on this PC. For another PC, set EUREKA_URL before starting.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true            # needed later to find AUTH-SERVICE for OpenFeign
    healthcheck:
      enabled: true                 # Eureka shows the real /actuator/health status (DOWN if MySQL is down)
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true                 # publishes the info.* properties below in /actuator/info

# Published in /actuator/info
info:
  app:
    name: User / Profiling
    version: 1.0.0
    description: Microservice de gestion des profils, interets, competences et styles d'apprentissage
    team: The Skill Weavers
